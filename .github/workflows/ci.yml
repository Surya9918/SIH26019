name: SIH26019 CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Validate Land Governance Platform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Geospatial Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgeos-dev libgdal-dev sqlite3

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Database Seeding
      run: |
        python database/seeds/seed_data.py

    - name: Run Unit & Integration Tests
      run: |
        PYTHONPATH=. python -m unittest discover -s tests -p "test_*.py" -v

    - name: Security Check & Integrity Validation
      run: |
        PYTHONPATH=. python -c "from backend.services.provenance_service import provenance_service; is_valid, issues = provenance_service.verify_integrity(); assert is_valid, f'Integrity failed: {issues}'; print('Ledger integrity verified!')"
