version: '3.8'

services:
  web:
    build: .
    container_name: sih26019_land_governance_platform
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_PATH=/app/data/land_governance.db
      - SECRET_KEY=sih26019-production-ready-secure-key-2026
    volumes:
      - platform_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  platform_data:
